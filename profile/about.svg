<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150">
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .t { fill: #cfdee5; } .s { fill: #8fa9b6; } .d { fill: #56707d; }
    .c { fill: #7fbccd; } .p { fill: #86c2a4; } .gold { fill: #cfb57d; } .lil { fill: #ad9fd6; }
    .cur { opacity: .55; }
    .bub { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
    .tw { opacity: .3; }
    .drift { animation: drift 7s ease-in-out infinite; }
    .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3s ease-in-out infinite; }
    .ray { animation: ray 9s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes tw { 0%, 100% { opacity: .12; } 50% { opacity: .85; } }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes ray { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
 @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 1; } 50% { transform: translate(6px, -75px); } 85% { opacity: .9; } 100% { transform: translate(0, -150px); opacity: 0; } }</style>
