    .tw { animation: tw 3.5s ease-in-out infinite; }
    .drift { animation: drift 7s ease-in-out infinite; }
    .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3s ease-in-out infinite; }
    .ray { animation: ray 9s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes tw { 0%, 100% { opacity: .12; } 50% { opacity: .85; } }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes ray { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
 @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 1; } 50% { transform: translate(6px, -120px); } 85% { opacity: .9; } 100% { transform: translate(0, -240px); opacity: 0; } }</style>
