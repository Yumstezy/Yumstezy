      <path d="M1 22 Q1 1 20 1 Q39 1 39 22 Q34 26 29.5 22 Q25 26 20 22 Q15 26 10.5 22 Q6 26 1 22Z" fill="url(#jbell)" stroke="#6fd3e8" stroke-opacity=".5"/>
    </symbol>
  </defs>
