        <path d="M9 22 q-5 12 0 24 q5 12 0 24 q-4 8 0 14"/>
        <path d="M16 23 q4 10 0 20 q-4 10 0 20"/>
        <path d="M24 23 q-4 10 0 20 q4 10 0 20"/>
        <path d="M31 22 q5 12 0 24 q-5 12 0 24 q4 8 0 14"/>
